<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数值指标卡 - 虚拟机总数</title>
<style>
  /* ===== 基础主题（深色大屏） ===== */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1d32; /* 截图底色：深藏青 */
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }

  /* ===== 指标卡容器：按截图原始尺寸 411x186 ===== */
  .indicator-card {
    width: 411px;
    height: 186px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 0 28px;
  }

  /* 左侧 3D 层叠图标 */
  .indicator-icon {
    flex: 0 0 118px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .indicator-icon svg { width: 100%; height: 100%; }

  /* 右侧文字区 */
  .indicator-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }
  .value-row {
    display: flex;
    align-items: baseline;
    line-height: 1;
  }
  .value {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 2px;
  }
  .unit {
    font-size: 22px;
    font-weight: 700;
    margin-left: 10px;
    letter-spacing: 1px;
  }
  .label {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
  }
</style>
</head>
<body>

  <div class="indicator-card">
    <!-- 左侧：等轴测层叠方块图标（inline SVG，渐变+发光） -->
    <div class="indicator-icon">
      <svg viewBox="0 0 120 134" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 顶面渐变：亮青 -->
          <linearGradient id="topG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8ff4ff"/>
            <stop offset="1" stop-color="#35b6ea"/>
          </linearGradient>
          <!-- 左面渐变：中青 -->
          <linearGradient id="leftG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2b9fd8"/>
            <stop offset="1" stop-color="#1668b0"/>
          </linearGradient>
          <!-- 右面渐变：暗青 -->
          <linearGradient id="rightG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1d7fc0"/>
            <stop offset="1" stop-color="#0f4f8f"/>
          </linearGradient>
          <!-- 发光滤镜 -->
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g filter="url(#glow)" stroke="#9feaff" stroke-width="1.2" stroke-linejoin="round">
          <!-- 顶部悬浮的线框菱形 -->
          <polygon points="60,8 100,26 60,44 20,26" fill="rgba(80,200,255,0.08)"/>
          <!-- 第一层 -->
          <polygon points="60,36 100,54 60,72 20,54" fill="url(#topG)"/>
          <polygon points="20,54 60,72 60,84 20,66" fill="url(#leftG)"/>
          <polygon points="100,54 60,72 60,84 100,66" fill="url(#rightG)"/>
          <!-- 第二层 -->
          <polygon points="60,60 100,78 60,96 20,78" fill="url(#topG)"/>
          <polygon points="20,78 60,96 60,108 20,90" fill="url(#leftG)"/>
          <polygon points="100,78 60,96 60,108 100,90" fill="url(#rightG)"/>
          <!-- 第三层 -->
          <polygon points="60,84 100,102 60,120 20,102" fill="url(#topG)"/>
          <polygon points="20,102 60,120 60,132 20,114" fill="url(#leftG)"/>
          <polygon points="100,102 60,120 60,132 100,114" fill="url(#rightG)"/>
        </g>
      </svg>
    </div>

    <!-- 右侧：数值 + 单位 + 标签 -->
    <div class="indicator-info">
      <div class="value-row">
        <span class="value" id="value"></span><span class="unit" id="unit"></span>
      </div>
      <div class="label" id="label"></div>
    </div>
  </div>

<script>
  /* ===== 参数区：颜色与数据集中配置 ===== */
  const CONFIG = {
    value: "120",       // 主数值（截图占位数据）
    unit: "台",         // 单位
    label: "虚拟机总数", // 指标名称
    colors: {
      value: "#ffffff",                 // 数字颜色
      unit: "#d8f1ff",                  // 单位颜色
      label: "#f0f8ff",                 // 标签颜色
      glow: "rgba(84, 205, 255, 0.75)"  // 文字青色光晕
    }
  };

  // 渲染：填充数据并应用颜色
  const { colors } = CONFIG;
  const elValue = document.getElementById("value");
  const elUnit = document.getElementById("unit");
  const elLabel = document.getElementById("label");

  elValue.textContent = CONFIG.value;
  elUnit.textContent = CONFIG.unit;
  elLabel.textContent = CONFIG.label;

  elValue.style.color = colors.value;
  elValue.style.textShadow = `0 0 16px ${colors.glow}`;
  elUnit.style.color = colors.unit;
  elUnit.style.textShadow = `0 0 10px ${colors.glow}`;
  elLabel.style.color = colors.label;
  elLabel.style.textShadow = `0 0 12px ${colors.glow}`;
</script>
</body>
</html>
