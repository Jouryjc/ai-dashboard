# electron-builder 打包配置（CI 三平台构建用，见 .github/workflows/release.yml）
# 产物：win=NSIS 安装包 / mac=DMG / linux=AppImage+deb，均发布到 GitHub Releases
appId: com.jouryjc.aidashboard
productName: AI-Dashboard
# 显式发布目标：client/ 是子目录，electron-builder 从 .git/config 探测不到仓库
publish:
  provider: github
  owner: Jouryjc
  repo: ai-dashboard
directories:
  output: release
  # 构建资源目录：build/icon.png（1024×1024，源文件 icon.svg）由 electron-builder 自动转 icns/ico
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
  category: Utility
